name: Build Universal Linux Installer & Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to (e.g. RevivaNexGEN or v1.0.0)"
        required: false
        default: "RevivaNexGEN"

permissions:
  contents: write

jobs:
  build-linux-universal:
    name: Build Linux Universal (.AppImage, .deb, .tar.gz)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake nasm \
            libasound2-dev libgtk-3-dev libxkbcommon-dev \
            libssl-dev libegl1-mesa-dev libgl1-mesa-dev \
            libwayland-dev libxrandr-dev libxi-dev libxcursor-dev \
            desktop-file-utils curl file libfuse2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Fetch bundled offline models (DeepFilterNet3 + IRCAM HRIR)
        run: |
          mkdir -p models
          curl -fL -o models/deepfilternet3.onnx \
            "https://huggingface.co/archgod94/tellcue-models/resolve/main/deepfilternet3.onnx"
          curl -fL -o models/IRC_1002_C.bin \
            "https://github.com/mrDIMAS/hrir_sphere_builder/raw/master/hrtf_base/IRCAM/IRC_1002_C.bin"

      - name: Create Universal .tar.gz Bundle with install.sh
        run: |
          mkdir -p dist/reviva-nexgen-linux-x86_64/models
          cp target/release/nexgen_desktop_rust dist/reviva-nexgen-linux-x86_64/reviva-nexgen-audio-restorer
          chmod +x dist/reviva-nexgen-linux-x86_64/reviva-nexgen-audio-restorer
          cp models/deepfilternet3.onnx models/IRC_1002_C.bin models/README.md dist/reviva-nexgen-linux-x86_64/models/
          cp assets/app_icon.png LICENSE TERMS_OF_USE.txt README.md dist/reviva-nexgen-linux-x86_64/

          cat << 'EOF' > dist/reviva-nexgen-linux-x86_64/install.sh
          #!/usr/bin/env bash
          set -euo pipefail
          PREFIX="${HOME}/.local"
          APP_DIR="${PREFIX}/share/reviva-nexgen"
          mkdir -p "${APP_DIR}/models" "${PREFIX}/bin" "${PREFIX}/share/applications" "${PREFIX}/share/icons/hicolor/256x256/apps"
          cp reviva-nexgen-audio-restorer "${APP_DIR}/"
          chmod +x "${APP_DIR}/reviva-nexgen-audio-restorer"
          cp -r models/* "${APP_DIR}/models/"
          cp app_icon.png "${PREFIX}/share/icons/hicolor/256x256/apps/reviva-nexgen.png"
          ln -sf "${APP_DIR}/reviva-nexgen-audio-restorer" "${PREFIX}/bin/reviva-nexgen-audio-restorer"

          cat << 'DESKTOP' > "${PREFIX}/share/applications/reviva-nexgen.desktop"
          [Desktop Entry]
          Name=Reviva NexGEN Audio Restorer
          Comment=AI Retro Audio Restoration & Stereo Reconstruction
          Exec=${HOME}/.local/share/reviva-nexgen/reviva-nexgen-audio-restorer
          Icon=reviva-nexgen
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;AudioVideoEditing;
          DESKTOP

          echo "Installed Reviva NexGEN Audio Restorer to ${APP_DIR}"
          echo "Run with: reviva-nexgen-audio-restorer"
          EOF
          chmod +x dist/reviva-nexgen-linux-x86_64/install.sh

          tar -C dist -czf dist/Reviva-NexGEN-Audio-Restorer-Linux-x86_64.tar.gz reviva-nexgen-linux-x86_64

      - name: Build Universal .AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/bin/models
          cp target/release/nexgen_desktop_rust AppDir/usr/bin/reviva-nexgen-audio-restorer
          chmod +x AppDir/usr/bin/reviva-nexgen-audio-restorer
          cp models/deepfilternet3.onnx models/IRC_1002_C.bin AppDir/usr/bin/models/
          cp assets/app_icon.png AppDir/reviva-nexgen.png
          cp assets/app_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/reviva-nexgen.png

          cat << 'EOF' > AppDir/reviva-nexgen.desktop
          [Desktop Entry]
          Name=Reviva NexGEN Audio Restorer
          Comment=AI Retro Audio Restoration & Stereo Reconstruction
          Exec=reviva-nexgen-audio-restorer
          Icon=reviva-nexgen
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;
          EOF
          cp AppDir/reviva-nexgen.desktop AppDir/usr/share/applications/reviva-nexgen.desktop

          cat << 'EOF' > AppDir/AppRun
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          cd "${HERE}/usr/bin"
          exec "${HERE}/usr/bin/reviva-nexgen-audio-restorer" "$@"
          EOF
          chmod +x AppDir/AppRun

          curl -fL -o appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run AppDir \
            dist/Reviva-NexGEN-Audio-Restorer-x86_64.AppImage

      - name: Build Debian/Ubuntu .deb package
        run: |
          PKG="deb_pkg/reviva-nexgen-audio-restorer_1.0.0_amd64"
          mkdir -p "${PKG}/DEBIAN" "${PKG}/opt/reviva-nexgen/models" "${PKG}/usr/local/bin" \
                   "${PKG}/usr/share/applications" "${PKG}/usr/share/icons/hicolor/256x256/apps"

          cp target/release/nexgen_desktop_rust "${PKG}/opt/reviva-nexgen/reviva-nexgen-audio-restorer"
          chmod 755 "${PKG}/opt/reviva-nexgen/reviva-nexgen-audio-restorer"
          cp models/deepfilternet3.onnx models/IRC_1002_C.bin "${PKG}/opt/reviva-nexgen/models/"
          cp assets/app_icon.png "${PKG}/usr/share/icons/hicolor/256x256/apps/reviva-nexgen.png"
          ln -s /opt/reviva-nexgen/reviva-nexgen-audio-restorer "${PKG}/usr/local/bin/reviva-nexgen-audio-restorer"

          cat << 'EOF' > "${PKG}/usr/share/applications/reviva-nexgen.desktop"
          [Desktop Entry]
          Name=Reviva NexGEN Audio Restorer
          Comment=AI Retro Audio Restoration & Stereo Reconstruction
          Exec=/opt/reviva-nexgen/reviva-nexgen-audio-restorer
          Icon=reviva-nexgen
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;AudioVideoEditing;
          EOF

          cat << 'EOF' > "${PKG}/DEBIAN/control"
          Package: reviva-nexgen-audio-restorer
          Version: 1.0.0
          Section: sound
          Priority: optional
          Architecture: amd64
          Depends: libasound2, libgtk-3-0, libgl1, libegl1
          Maintainer: Dr. Vinayak Ashok Bharadi <vinayagaurang@zohomail.in>
          Description: Reviva NexGEN Audio Restorer - AI Retro Audio Restoration & Stereo Reconstruction
          EOF

          dpkg-deb --build "${PKG}" dist/Reviva-NexGEN-Audio-Restorer_1.0.0_amd64.deb

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reviva-nexgen-linux-installers
          path: |
            dist/Reviva-NexGEN-Audio-Restorer-x86_64.AppImage
            dist/Reviva-NexGEN-Audio-Restorer_1.0.0_amd64.deb
            dist/Reviva-NexGEN-Audio-Restorer-Linux-x86_64.tar.gz

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || 'RevivaNexGEN' }}
          files: |
            dist/Reviva-NexGEN-Audio-Restorer-x86_64.AppImage
            dist/Reviva-NexGEN-Audio-Restorer_1.0.0_amd64.deb
            dist/Reviva-NexGEN-Audio-Restorer-Linux-x86_64.tar.gz
