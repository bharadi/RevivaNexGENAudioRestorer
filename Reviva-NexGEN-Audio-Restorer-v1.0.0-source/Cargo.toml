[package]
name = "nexgen_desktop_rust"
version = "1.0.0"
edition = "2021"
authors = ["Dr. Vinayak Ashok Bharadi <vinayagaurang@zohomail.in>"]
license = "MIT"
description = "Reviva NexGEN Audio Restorer — Native Windows Desktop AI Audio Restoration & Stereo Reconstruction"

[dependencies]
# Desktop GUI (pure Rust immediate mode)
eframe = "0.29"
egui = "0.29"
image = "0.25"
rfd = "0.15"

# Audio Decoding, Resampling, Playback, Mastering & Encoding
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "ogg", "aac", "isomp4"] }
hound = "3.5"
mp3lame-encoder = "0.2"
flacenc = "0.4"
lofty = "0.22"
ebur128 = "0.1"
hrtf = "0.9"
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3", "symphonia-wav", "symphonia-flac"] }
rubato = "0.15"
rustfft = "6.2"
realfft = "3.4"
rayon = "1.10"

# Deep Learning Inference (ONNX Runtime with DirectML GPU + CPU)
ort = { version = "2.0.0-rc.9", default-features = false, features = ["load-dynamic", "directml"] }

# Concurrency & Utilities
crossbeam-channel = "0.5"
sysinfo = "0.32"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.10"
sha2 = "0.10"

[build-dependencies]
winresource = "0.1"
